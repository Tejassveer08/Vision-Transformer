[project]
name = "ucf101-video-vit"
version = "0.2.0"
description = "Video Vision Transformer (ViViT) and X3D/SlowFast/MViT action recognition on UCF101"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "pytorchvideo==0.1.5",
    "fvcore",
    "av",
    "opencv-python-headless>=4.8",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "tqdm",
    "tensorboard",
    "gradio>=5",
    "kaggle",
    "six",
]

[tool.black]
line-length = 120
